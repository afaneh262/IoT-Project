<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sustainable Smart Home IoT System - Slides</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          },
          boxShadow: {
            glow: '0 20px 60px rgba(37,99,235,.25)',
          }
        }
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    html, body { height: 100%; }
    body { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }

    .slide-enter {
      opacity: 0;
      transform: translateX(48px);
    }
    .slide-enter-active {
      opacity: 1;
      transform: translateX(0);
      transition: opacity 450ms ease, transform 450ms ease;
    }
    .slide-exit {
      opacity: 1;
      transform: translateX(0);
    }
    .slide-exit-active {
      opacity: 0;
      transform: translateX(-48px);
      transition: opacity 450ms ease, transform 450ms ease;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    Chart.defaults.font.family = "ui-sans-serif, system-ui, Segoe UI, Tahoma, Geneva, Verdana, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#334155';
    Chart.defaults.borderColor = 'rgba(148, 163, 184, .35)';

    function classNames(...parts) {
      return parts.filter(Boolean).join(' ');
    }

    function IconBadge({ children, className }) {
      return (
        <div className={classNames(
          'inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-2.5 py-1.5 text-lg shadow-[0_10px_30px_rgba(2,6,23,.08)]',
          className
        )}>
          {children}
        </div>
      );
    }

    function Card({ title, icon, children, className }) {
      return (
        <div className={classNames(
          'group rounded-3xl border border-slate-200 bg-white p-4 shadow-[0_12px_40px_rgba(2,6,23,.10)] transition-transform duration-300 hover:-translate-y-1 hover:shadow-[0_18px_60px_rgba(37,99,235,.18)]',
          className
        )}>
          <div className="flex items-start gap-4">
            {icon ? (
              <div className="shrink-0">
                <IconBadge className="text-2xl">{icon}</IconBadge>
              </div>
            ) : null}
            <div className="min-w-0">
              {title ? (
                <h3 className="text-base font-semibold tracking-tight text-slate-900">{title}</h3>
              ) : null}
              <div className="mt-2 text-[13px] leading-5 text-slate-700">
                {children}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Metric({ value, label }) {
      return (
        <div className="rounded-2xl border border-slate-200 bg-white p-3 text-center">
          <div className="text-xl font-semibold text-slate-900">{value}</div>
          <div className="mt-1 text-xs text-slate-600">{label}</div>
        </div>
      );
    }

    function ScenarioComparisonTable({ title, rows, highlight }) {
      return (
        <div className="rounded-3xl border border-slate-200 bg-white p-4">
          <div className="flex items-center justify-between">
            <div className="text-sm font-semibold text-slate-900">{title}</div>
            <div className="text-xs text-slate-500">Highlighted: {highlight} people</div>
          </div>
          <div className="mt-3 overflow-hidden rounded-2xl border border-slate-200">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 text-slate-700">
                <tr>
                  <th className="px-3 py-2 font-semibold">Occ.</th>
                  {rows.columns.map((c) => (
                    <th key={c} className="px-3 py-2 font-semibold">{c}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {rows.data.map((r) => (
                  <tr key={r.occ} className={r.occ === highlight ? 'bg-brand-50/60' : 'bg-white'}>
                    <td className="px-3 py-2 font-semibold text-slate-900">{r.occ}</td>
                    {r.values.map((v, idx) => (
                      <td key={idx} className="px-3 py-2 text-slate-700">{v}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function SlideShell({ accent = 'from-brand-200 via-purple-200/60 to-emerald-200/60', children }) {
      const normalizedAccent = accent.includes('from-slate-900') ? 'from-white via-brand-100/70 to-emerald-100/70' : accent;
      return (
        <div className="relative h-full w-full overflow-hidden">
          <div className={classNames(
            'pointer-events-none absolute inset-0 bg-gradient-to-br',
            normalizedAccent
          )} />
          <div className="pointer-events-none absolute -top-24 left-1/2 h-[520px] w-[520px] -translate-x-1/2 rounded-full bg-brand-300/50 blur-3xl" />
          <div className="pointer-events-none absolute -bottom-24 right-0 h-[420px] w-[420px] rounded-full bg-emerald-300/40 blur-3xl" />
          <div className="relative mx-auto flex h-full max-w-7xl flex-col px-5 py-6 md:px-8 md:py-8 min-h-0">
            <div className="flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
              {children}
            </div>
          </div>
        </div>
      );
    }

    function ChartCanvas({ id, config, active }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!active) return;
        const el = canvasRef.current;
        if (!el) return;

        if (chartRef.current) {
          chartRef.current.destroy();
          chartRef.current = null;
        }

        chartRef.current = new Chart(el, config);
        return () => {
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
        };
      }, [active, config]);

      return (
        <div className="rounded-3xl border border-slate-200 bg-white p-3">
          <div className="relative h-[220px] md:h-[260px]">
            <canvas id={id} ref={canvasRef} />
          </div>
        </div>
      );
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function dailyProfileForScenario(s) {
      return [
        clamp(s.baseLoadKw, 1.2, 2.2),
        clamp(s.baseLoadKw - 0.2, 1.0, 2.0),
        clamp(s.avgLoadKw - 1.4, 1.5, 3.5),
        clamp(s.avgLoadKw + 0.6, 3.5, 6.8),
        clamp(s.avgLoadKw + 0.2, 3.0, 6.4),
        clamp(s.avgLoadKw - 0.3, 2.8, 6.0),
        clamp(s.avgLoadKw + 1.8, 4.2, 9.0),
        clamp(s.peakLoadKw, 6.5, 12.8),
        clamp(s.avgLoadKw - 1.0, 2.2, 5.2),
      ];
    }

    function computeScenario(occupancy) {
      const people = occupancy;
      const baseLoadKw = 1.6; // fridge, networking, standby, etc.
      const peopleLoadKw = people * 0.22; // devices + extra lighting + water heater usage proxy
      const hvacFactor = 1 + (people - 4) * 0.08;
      const avgLoadKw = clamp(baseLoadKw + peopleLoadKw + 1.6 * hvacFactor, 3.4, 6.2);
      const peakLoadKw = clamp(avgLoadKw * 1.9, 7.2, 12.8);
      const dailyKwh = Math.round(avgLoadKw * 24);

      const messagesPerMin = Math.round(650 + (people - 4) * 90); // occupancy increases activity events
      const edgeNoiseReductionPct = clamp(18 + (people - 4) * 1.5, 18, 23);
      const bandwidthReductionPct = edgeNoiseReductionPct;

      const solarShare = clamp(73 - (people - 4) * 1.2, 68, 75);
      const windShare = 100 - solarShare;

      const selfSufficiencyPct = clamp(92 - (people - 4) * 2.5, 78, 92);

      return {
        people,
        baseLoadKw: Number(baseLoadKw.toFixed(1)),
        avgLoadKw: Number(avgLoadKw.toFixed(1)),
        peakLoadKw: Number(peakLoadKw.toFixed(1)),
        dailyKwh,
        messagesPerMin,
        bandwidthReductionPct: Number(bandwidthReductionPct.toFixed(0)),
        solarShare: Number(solarShare.toFixed(0)),
        windShare: Number(windShare.toFixed(0)),
        selfSufficiencyPct: Number(selfSufficiencyPct.toFixed(0)),
      };
    }

    function ProgressRow({ label, value, active }) {
      const [width, setWidth] = useState('0%');

      useEffect(() => {
        if (!active) {
          setWidth('0%');
          return;
        }
        const t = setTimeout(() => setWidth(value), 150);
        return () => clearTimeout(t);
      }, [active, value]);

      return (
        <div className="space-y-2">
          <div className="flex items-center justify-between text-sm">
            <span className="text-slate-700">{label}</span>
            <span className="text-slate-900 font-semibold">{value}</span>
          </div>
          <div className="h-3 overflow-hidden rounded-full bg-slate-200">
            <div
              className="h-full rounded-full bg-gradient-to-r from-emerald-400 to-brand-500 transition-[width] duration-1000"
              style={{ width }}
            />
          </div>
        </div>
      );
    }

    function SlidesApp() {
      const occupancy = 4;
      const scenario = useMemo(() => computeScenario(occupancy), []);

      const slides = useMemo(() => {
        const commonTitle = (
          <div>
            <div className="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-xs text-slate-700">
              <span className="h-2 w-2 rounded-full bg-emerald-500" />
              IEEE Implementation • AI/ML • Renewable Energy
            </div>
          </div>
        );

        const monthLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const baseSolar = [2850, 3200, 4100, 4500, 4900, 5200, 5400, 5100, 4600, 3900, 3100, 2700];
        const baseWind = [1650, 1550, 1700, 1800, 1650, 1300, 1100, 1200, 1400, 1600, 1720, 1850];
        const yearlyTotalKwh = baseSolar.reduce((a, b) => a + b, 0) + baseWind.reduce((a, b) => a + b, 0);
        const occupancyLevels = [4, 5, 6, 7];
        const scenarioByOcc = Object.fromEntries(occupancyLevels.map((o) => [o, computeScenario(o)]));

        const yearlyConsumptionKwhByOcc = Object.fromEntries(
          occupancyLevels.map((o) => [o, Math.round(scenarioByOcc[o].dailyKwh * 365)])
        );

        const monthlyConsumptionByOcc = Object.fromEntries(
          occupancyLevels.map((o) => {
            const scale = yearlyConsumptionKwhByOcc[o] / yearlyTotalKwh;
            return [o, monthLabels.map((_, i) => Math.round((baseSolar[i] + baseWind[i]) * scale))];
          })
        );

        const occColors = {
          4: 'rgba(16, 185, 129, 1)',
          5: 'rgba(59, 130, 246, 1)',
          6: 'rgba(168, 85, 247, 1)',
          7: 'rgba(239, 68, 68, 1)',
        };

        const energyGenerationConfig = {
          type: 'bar',
          data: {
            labels: monthLabels,
            datasets: [
              {
                label: 'Solar (kWh)',
                data: baseSolar,
                backgroundColor: 'rgba(251, 191, 36, 0.75)',
                borderColor: 'rgba(251, 191, 36, 1)',
                borderWidth: 2,
              },
              {
                label: 'Wind (kWh)',
                data: baseWind,
                backgroundColor: 'rgba(59, 130, 246, 0.75)',
                borderColor: 'rgba(59, 130, 246, 1)',
                borderWidth: 2,
              },
              ...occupancyLevels.map((o) => ({
                label: `Consumption (kWh) • ${o} people`,
                data: monthlyConsumptionByOcc[o],
                type: 'line',
                borderColor: occColors[o],
                backgroundColor: 'rgba(15, 23, 42, 0)',
                borderWidth: o === scenario.people ? 4 : 2,
                tension: 0.35,
                pointRadius: o === scenario.people ? 3 : 2,
                pointHoverRadius: 4,
                borderDash: o === 4 ? [] : [6, 4],
                order: 0,
              })),
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#334155' } },
              title: { display: true, text: 'Generation vs Consumption (Occupancy Simulation)', color: '#0f172a' },
            },
            scales: {
              x: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
              y: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
            },
          },
        };

        const consumptionPatternConfig = {
          type: 'line',
          data: {
            labels: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00', '24:00'],
            datasets: occupancyLevels.map((o) => ({
              label: `Load (kW) • ${o} people`,
              data: dailyProfileForScenario(scenarioByOcc[o]),
              borderColor: occColors[o],
              backgroundColor: 'rgba(15, 23, 42, 0)',
              borderWidth: o === scenario.people ? 4 : 2,
              tension: 0.4,
              pointRadius: o === scenario.people ? 3 : 2,
              pointHoverRadius: 4,
              fill: false,
              borderDash: o === 4 ? [] : [6, 4],
            })),
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#334155' } },
              title: { display: true, text: 'Daily Load Profiles (Occupancy Simulation)', color: '#0f172a' },
            },
            scales: {
              x: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
              y: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
            },
          },
        };

        const mlPerformanceConfig = {
          type: 'radar',
          data: {
            labels: ['HVAC', 'Lighting', 'Irrigation', 'Ventilation', 'Alarm'],
            datasets: [
              {
                label: 'Accuracy (%)',
                data: [94.2, 96.8, 91.5, 90.8, 89.2],
                backgroundColor: 'rgba(16, 185, 129, 0.2)',
                borderColor: 'rgba(16, 185, 129, 1)',
                borderWidth: 2,
                pointBackgroundColor: 'rgba(16, 185, 129, 1)',
              },
              {
                label: 'Precision (%)',
                data: [92.5, 95.2, 89.8, 88.5, 87.1],
                backgroundColor: 'rgba(168, 85, 247, 0.2)',
                borderColor: 'rgba(168, 85, 247, 1)',
                borderWidth: 2,
                pointBackgroundColor: 'rgba(168, 85, 247, 1)',
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#334155' } },
              title: { display: true, text: 'Random Forest Model Performance', color: '#0f172a' },
            },
            scales: {
              r: {
                beginAtZero: true,
                max: 100,
                ticks: { color: '#334155' },
                grid: { color: 'rgba(148,163,184,.35)' },
                pointLabels: { color: '#0f172a' },
              },
            },
          },
        };

        const batteryPerformanceConfig = {
          type: 'line',
          data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
            datasets: [
              {
                label: 'Battery Health (%)',
                data: [100, 99.8, 99.6, 99.4, 99.2, 99.0, 98.8, 98.6, 98.5, 98.3, 98.2, 98.2],
                borderColor: 'rgba(16, 185, 129, 1)',
                backgroundColor: 'rgba(16, 185, 129, 0.12)',
                borderWidth: 3,
                tension: 0.35,
              },
              {
                label: 'Avg State of Charge (%)',
                data: [68, 65, 72, 75, 78, 70, 65, 67, 73, 76, 71, 69],
                borderColor: 'rgba(59, 130, 246, 1)',
                backgroundColor: 'rgba(59, 130, 246, 0.12)',
                borderWidth: 3,
                tension: 0.35,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#334155' } },
              title: { display: true, text: 'Battery System Performance (12 Months)', color: '#0f172a' },
            },
            scales: {
              x: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
              y: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' }, min: 0, max: 100 },
            },
          },
        };

        const seasonalPerformanceConfig = {
          type: 'doughnut',
          data: {
            labels: ['Winter', 'Spring', 'Summer', 'Autumn'],
            datasets: [
              {
                label: 'Total Energy (kWh)',
                data: [13200, 19200, 21200, 17200],
                backgroundColor: [
                  'rgba(147, 197, 253, 0.8)',
                  'rgba(134, 239, 172, 0.8)',
                  'rgba(251, 191, 36, 0.8)',
                  'rgba(251, 146, 60, 0.8)',
                ],
                borderColor: [
                  'rgba(59, 130, 246, 1)',
                  'rgba(34, 197, 94, 1)',
                  'rgba(245, 158, 11, 1)',
                  'rgba(249, 115, 22, 1)',
                ],
                borderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: '#334155' } },
              title: { display: true, text: 'Renewable Energy by Season', color: '#0f172a' },
            },
          },
        };

        const costSavingsConfig = {
          type: 'line',
          data: {
            labels: ['Year 1', 'Year 2', 'Year 3', 'Year 4', 'Year 5', 'Year 10', 'Year 15', 'Year 20'],
            datasets: [
              {
                label: 'Cumulative Savings ($)',
                data: [8746, 18200, 28350, 39180, 50700, 102500, 155800, 175200],
                borderColor: 'rgba(16, 185, 129, 1)',
                backgroundColor: 'rgba(16, 185, 129, 0.12)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
              },
              {
                label: 'Initial Investment ($)',
                data: [45000, 45000, 45000, 45000, 45000, 45000, 45000, 45000],
                borderColor: 'rgba(248, 113, 113, 1)',
                backgroundColor: 'rgba(248, 113, 113, 0.12)',
                borderWidth: 2,
                borderDash: [10, 5],
                fill: false,
                tension: 0.1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#334155' } },
              title: { display: true, text: 'Return on Investment (20 Years)', color: '#0f172a' },
            },
            scales: {
              x: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
              y: {
                ticks: {
                  color: '#334155',
                  callback: (v) => '$' + Number(v).toLocaleString(),
                },
                grid: { color: 'rgba(148,163,184,.35)' },
                beginAtZero: true,
              },
            },
          },
        };

        const environmentalConfig = {
          type: 'bar',
          data: {
            labels: ['CO₂ Avoided (tons)', 'Trees Equivalent', 'Cars Off Road', 'Coal Not Burned (tons)'],
            datasets: [
              {
                label: 'Impact',
                data: [32.5, 1500, 7, 16.2],
                backgroundColor: [
                  'rgba(16, 185, 129, 0.8)',
                  'rgba(34, 197, 94, 0.8)',
                  'rgba(59, 130, 246, 0.8)',
                  'rgba(168, 85, 247, 0.8)',
                ],
                borderColor: [
                  'rgba(16, 185, 129, 1)',
                  'rgba(34, 197, 94, 1)',
                  'rgba(59, 130, 246, 1)',
                  'rgba(168, 85, 247, 1)',
                ],
                borderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              title: { display: true, text: 'Annual Environmental Impact', color: '#0f172a' },
            },
            scales: {
              x: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' } },
              y: { ticks: { color: '#334155' }, grid: { color: 'rgba(148,163,184,.35)' }, beginAtZero: true },
            },
          },
        };

        return [
          {
            key: 'title',
            accent: 'from-brand-200 via-violet-200/60 to-emerald-200/60',
            render: () => (
              <SlideShell accent="from-brand-200 via-violet-200/60 to-emerald-200/60">
                <div className="flex items-center justify-between gap-4">
                  {commonTitle}
                  <div className="hidden md:flex items-center gap-2 text-xs text-slate-600">
                    <span className="rounded-full border border-slate-200 bg-white px-3 py-1.5">Use ←/→ or Space</span>
                    <span className="rounded-full border border-slate-200 bg-white px-3 py-1.5">Esc to exit full screen</span>
                  </div>
                </div>

                <div className="mt-10 grid gap-8 md:grid-cols-5 md:items-center">
                  <div className="md:col-span-3">
                    <h1 className="text-4xl font-semibold tracking-tight text-slate-900 md:text-6xl">
                      Sustainable Smart Home IoT System
                    </h1>
                    <p className="mt-4 max-w-2xl text-base text-slate-700 md:text-lg">
                      A complete IEEE paper implementation with AI/ML intelligence and renewable energy integration.
                    </p>

                    <div className="mt-8 grid grid-cols-2 gap-3 md:grid-cols-4">
                      <Metric value="50+" label="IoT Sensors" />
                      <Metric value="30+" label="Actuators" />
                      <Metric value="100%" label="IEEE Compliance" />
                      <Metric value="92%+" label="ML Accuracy" />
                    </div>

                    <div className="mt-8 flex flex-wrap gap-2 text-xs text-slate-600">
                      <span className="rounded-full border border-slate-200 bg-white px-3 py-1.5">Edge + Gateway Intelligence</span>
                      <span className="rounded-full border border-slate-200 bg-white px-3 py-1.5">MongoDB Analytics</span>
                      <span className="rounded-full border border-slate-200 bg-white px-3 py-1.5">AES-256 + HMAC</span>
                    </div>
                  </div>

                  <div className="md:col-span-2">
                    <div className="rounded-3xl border border-slate-200 bg-white p-6">
                      <div className="text-sm text-slate-600">Snapshot</div>
                      <div className="mt-3 space-y-4">

      const [index, setIndex] = useState(0);
      const activeSlide = slides[index];

      const goPrev = () => setIndex((i) => Math.max(0, i - 1));
      const goNext = () => setIndex((i) => Math.min(total - 1, i + 1));

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            goNext();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            goPrev();
          }
        };
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      }, [total]);

      const progress = ((index + 1) / total) * 100;

      return (
        <div className="h-full bg-slate-100">
          <div className="fixed left-0 right-0 top-0 z-50">
            <div className="h-1 bg-slate-200">
              <div className="h-full bg-gradient-to-r from-emerald-500 to-brand-600" style={{ width: progress + '%' }} />

              onClick={goNext}
              disabled={index === total - 1}
            >
              Next →
            </button>
          </div>
        </div>
